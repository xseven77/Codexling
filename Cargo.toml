[workspace]
resolver = "2"
members = [
    "crates/gateway-ir",
    "crates/gateway-stream",
    "crates/gateway-state",
    "crates/protocol-openai-chat",
    "crates/protocol-openai-responses",
    "crates/protocol-anthropic-messages",
    "crates/gateway-routing",
    "crates/provider-openai-compatible",
    "crates/gateway-server",
    "spikes/gateway-feasibility",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
