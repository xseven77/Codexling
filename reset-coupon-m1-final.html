<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Codexling · 重置券 M1 定稿</title>
<style>
  :root {
    --pg-bg: #08090a; --pg-sub: #95a0a8;
    --green: #28c04e; --green-dk: #1a9a3c;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--pg-bg); color: #eceff1; }
  .page { width: min(920px, calc(100% - 32px)); margin: auto; padding: 36px 0 56px; }
  h1 { margin: 0 0 8px; font-size: 22px; }
  p { margin: 0 0 24px; color: var(--pg-sub); font-size: 12.5px; line-height: 1.7; max-width: 640px; }
  .row { display: flex; flex-wrap: wrap; gap: 20px; }
  .lbl { font-size: 9px; color: #6d7579; font-family: ui-monospace, Menlo, monospace; margin-bottom: 8px; }
  .shell { border-radius: 16px; padding: 14px; background: linear-gradient(180deg, #f5f8f6, #e6ece8); border: 1px solid rgba(20,30,26,.08); }
  .w420 { max-width: 420px; flex: 1; min-width: 280px; }
  .w330 { max-width: 330px; flex: 1; min-width: 280px; }

  .card {
    --card: #fff; --mist: #eef2ef; --ink: #121614; --muted: #6d756f; --line: #d5dcd7; --track: #e4e8e5;
    border-radius: 14px; background: var(--card); border: .75px solid var(--line);
    box-shadow: 0 6px 22px rgba(20,30,26,.06), 0 1px 3px rgba(20,30,26,.04);
    overflow: hidden; color: var(--ink);
  }
  .rail-top {
    padding: 11px 14px 10px;
    background: linear-gradient(180deg, #fafcfb 0%, #fff 100%);
  }
  .rail-hd { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 9px; }
  .rail-hd b { font-size: 10.5px; font-weight: 650; letter-spacing: -.01em; }
  .rail-hd s { text-decoration: none; font-size: 9px; color: var(--muted); font-weight: 500; }
  .rail { position: relative; height: 30px; }
  .rail::before { content: ""; position: absolute; left: 0; right: 0; top: 13px; height: 3px; border-radius: 99px; background: var(--track); }
  .dot {
    position: absolute; top: 8px; transform: translateX(-50%); width: 28px; height: 28px;
    border: 0; padding: 0; background: none; cursor: pointer; display: grid; place-items: center;
  }
  .dot i { display: block; width: 9px; height: 9px; border-radius: 50%; background: #c8cfca; border: 2px solid #fff; box-shadow: 0 1px 2px rgba(0,0,0,.06); transition: all .18s ease; }
  .dot.on i { width: 12px; height: 12px; background: var(--green); box-shadow: 0 0 0 4px rgba(40,192,78,.18), 0 2px 6px rgba(40,192,78,.28); }
  .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 12px; margin-top: 7px; font-size: 8.5px; color: var(--muted); }
  .meta span em { font-style: normal; color: var(--ink); font-weight: 650; }

  .sep { height: 1px; background: var(--line); opacity: .85; }
  .msg { padding: 0; }
  .msg-head { display: flex; align-items: center; gap: 9px; padding: 10px 14px 0; }
  .av { width: 30px; height: 30px; border-radius: 9px; object-fit: cover; background: #e8f2ec; border: .6px solid rgba(0,0,0,.06); }
  .msg-head .who b { display: block; font-size: 10px; font-weight: 650; }
  .msg-head .who s { font-size: 8.5px; color: var(--muted); text-decoration: none; }
  .idx { font-size: 8px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .msg-body { padding: 7px 14px 9px; }
  .msg-title { font-size: 13px; font-weight: 750; letter-spacing: -.025em; margin-bottom: 4px; }
  .msg-desc { font-size: 9.5px; line-height: 1.55; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .msg-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 9px 14px 10px; background: color-mix(in srgb, var(--mist) 42%, #fff);
    border-top: .6px solid var(--line);
  }
  .msg-foot .exp { font-size: 9px; color: var(--muted); }
  .pager { display: flex; align-items: center; gap: 7px; }
  .dots { display: flex; gap: 4px; }
  .dots i { display: block; height: 4px; width: 4px; border-radius: 99px; background: var(--line); transition: all .15s; }
  .dots i.on { width: 11px; background: var(--green); }
  .btn {
    font-size: 9px; font-weight: 650; color: var(--green-dk); padding: 4px 10px; border-radius: 8px;
    border: .65px solid rgba(40,192,78,.24); background: rgba(40,192,78,.09); cursor: pointer;
  }
  .btn:hover { background: rgba(40,192,78,.14); }
  .compact .msg-desc { -webkit-line-clamp: 1; font-size: 9px; }
  .compact .meta { font-size: 8px; }

  .empty {
    display: flex; align-items: center; gap: 10px; padding: 13px 14px;
  }
  .empty .ico {
    width: 34px; height: 34px; border-radius: 9px; background: color-mix(in srgb, var(--mist) 80%, #fff);
    display: grid; place-items: center; color: var(--muted); font-size: 16px;
  }
  .empty b { display: block; font-size: 11px; font-weight: 650; }
  .empty s { display: block; text-decoration: none; font-size: 9px; color: var(--muted); margin-top: 2px; }
  h2 { margin: 32px 0 10px; font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
<main class="page">
  <h1>重置券 M1 · 定稿（轴在上 · 通知在下）</h1>
  <p>与 App 内 <code>ResetCouponFusionViews</code> 对齐。点击轨道圆点或「下一张」切换；420 / 330 共用同一结构。</p>
  <div class="row">
    <div class="w420"><div class="lbl">420px</div><div class="shell"><div class="card" id="c420"></div></div></div>
    <div class="w330"><div class="lbl">330px compact</div><div class="shell"><div class="card compact" id="c330"></div></div></div>
  </div>

  <h2>空态 · 0 张重置券</h2>
  <p>不显示时间轴与通知卡，仅保留与 M1 同圆角/描边/阴影的占位条。</p>
  <div class="row">
    <div class="w420"><div class="shell"><div class="card empty"><div class="ico">↺</div><div><b>重置券 0 张</b><s>当前没有可用重置券</s></div></div></div></div>
    <div class="w330"><div class="shell"><div class="card empty"><div class="ico">↺</div><div><b>重置券 0 张</b><s>当前没有可用重置券</s></div></div></div></div>
  </div>
</main>
<script>
const DATA = [
  { title:"Full reset", description:"Thanks for using Codex! You've been granted one free rate limit reset.", granted_at:"2026-06-26T23:34:21Z", expires_at:"2026-07-26T23:34:21Z", status:"available", reset_type:"codex_rate_limits", profile_user_id:"Codex Team", profile_image_url:"https://openaiassets.blob.core.windows.net/$web/codex/codex-icon-200.png" },
  { title:"Full reset", description:"Thanks for using Codex! You've been granted one free rate limit reset.", granted_at:"2026-07-01T19:50:25Z", expires_at:"2026-07-31T19:50:25Z", status:"available", reset_type:"codex_rate_limits", profile_user_id:"Codex Team", profile_image_url:"https://openaiassets.blob.core.windows.net/$web/codex/codex-icon-200.png" },
  { title:"Full reset", description:"Thanks for using Codex! You've been granted one free rate limit reset.", granted_at:"2026-07-13T17:26:40Z", expires_at:"2026-08-12T17:26:40Z", status:"available", reset_type:"codex_rate_limits", profile_user_id:"Codex Team", profile_image_url:"https://openaiassets.blob.core.windows.net/$web/codex/codex-icon-200.png" },
];
const sorted = [...DATA].sort((a,b)=>new Date(a.expires_at)-new Date(b.expires_at));
let sel = 0;
function ts(iso){ return new Date(iso).getTime(); }
function fmtShort(iso){ const d=new Date(iso); return `${d.getMonth()+1}月${d.getDate()}日`; }
function fmtDT(iso){ const d=new Date(iso); return `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
function typeLabel(t){ return t==="codex_rate_limits"?"重置 Codex 速率额度":"重置券"; }
function range(){ const g=sorted.map(x=>ts(x.granted_at)), e=sorted.map(x=>ts(x.expires_at)); return { min:Math.min(...g,...e), max:Math.max(...g,...e) }; }
function pctExp(iso){ const r=range(); return ((ts(iso)-r.min)/(r.max-r.min||1))*100; }

function render(rootId){
  const c = sorted[sel];
  const root = document.getElementById(rootId);
  const dots = sorted.map((item,i)=>`<button type="button" class="dot ${i===sel?"on":""}" style="left:${pctExp(item.expires_at)}%" data-i="${i}"><i></i></button>`).join("");
  root.innerHTML = `
    <div class="rail-top">
      <div class="rail-hd"><b>重置券有效期</b><s>${sorted.length} 张 · 按到期排序</s></div>
      <div class="rail">${dots}</div>
      <div class="meta">
        <span>获得 <em>${fmtShort(c.granted_at)}</em></span><span>到期 <em>${fmtShort(c.expires_at)}</em></span>
        <span>类型 <em>${typeLabel(c.reset_type)}</em></span><span>状态 <em>${c.status}</em></span>
      </div>
    </div>
    <div class="sep"></div>
    <div class="msg">
      <div class="msg-head">
        <img class="av" src="${c.profile_image_url}" alt="" />
        <div class="who"><b>${c.profile_user_id}</b><s>授予 · ${fmtShort(c.granted_at)}</s></div>
        <span class="idx">${sel+1}/${sorted.length}</span>
      </div>
      <div class="msg-body"><div class="msg-title">${c.title}</div><div class="msg-desc">${c.description}</div></div>
      <div class="msg-foot">
        <span class="exp">${fmtDT(c.expires_at)} 到期</span>
        <div class="pager"><div class="dots">${sorted.map((_,i)=>`<i class="${i===sel?"on":""}"></i>`).join("")}</div><button type="button" class="btn" data-next>下一张</button></div>
      </div>
    </div>`;
  root.querySelectorAll(".dot").forEach(b=>b.onclick=()=>{ sel=+b.dataset.i; render("c420"); render("c330"); });
  root.querySelector("[data-next]")?.addEventListener("click",()=>{ sel=(sel+1)%sorted.length; render("c420"); render("c330"); });
}
render("c420"); render("c330");
</script>
</body>
</html>
